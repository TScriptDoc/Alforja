<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C4123" />
      <stop offset="100%" stop-color="#5C2614" />
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BD5630" />
      <stop offset="100%" stop-color="#80331A" />
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6A035" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Saddlebag Main Body -->
  <rect x="18" y="28" width="92" height="78" rx="18" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Side Stitching -->
  <line x1="26" y1="36" x2="26" y2="98" stroke="#E59866" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="102" y1="36" x2="102" y2="98" stroke="#E59866" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Saddlebag Flap -->
  <path d="M 18,36 C 18,36 30,76 64,76 C 98,76 110,36 110,36 L 110,28 C 110,20 102,16 94,16 L 34,16 C 26,16 18,20 18,28 Z" fill="url(#flapGrad)" />

  <!-- Top Handle / Connector -->
  <path d="M 44,16 C 44,10 52,8 64,8 C 76,8 84,10 84,16" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>

  <!-- Vertical Fastener Straps -->
  <rect x="36" y="24" width="8" height="66" rx="4" fill="url(#strapGrad)" />
  <rect x="84" y="24" width="8" height="66" rx="4" fill="url(#strapGrad)" />

  <!-- Golden Buckles -->
  <rect x="34" y="66" width="12" height="14" rx="3" fill="#FCD34D" stroke="#B45309" stroke-width="1.5" />
  <rect x="37" y="70" width="6" height="6" fill="#78350F" />

  <rect x="82" y="66" width="12" height="14" rx="3" fill="#FCD34D" stroke="#B45309" stroke-width="1.5" />
  <rect x="85" y="70" width="6" height="6" fill="#78350F" />

  <!-- Andean Geometric Motif on Flap -->
  <polygon points="64,32 70,42 64,52 58,42" fill="#FCD34D" opacity="0.9" />
  <polygon points="50,38 54,44 50,50 46,44" fill="#FCD34D" opacity="0.7" />
  <polygon points="78,38 82,44 78,50 74,44" fill="#FCD34D" opacity="0.7" />
</svg>
